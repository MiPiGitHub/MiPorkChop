name: MiPorkChop software checks
on:
  push:
    branches: [2026ReSmoked]
  pull_request:
    branches: [2026ReSmoked]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile src/porkchop.py tests/test_porkchop.py
      - name: Shell syntax
        run: bash -n MiButcher.sh
      - name: Network client unit tests
        run: python -m unittest discover -s tests -v
